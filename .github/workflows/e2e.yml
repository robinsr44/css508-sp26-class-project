name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (moon-api)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git

      - name: Build moon-api
        run: |
          cmake -S src/backend -B build
          cmake --build build -j"$(nproc)"

      - name: Start moon-api on 8080
        run: |
          ./build/moon-api 8080 &
          echo $! > /tmp/moon-api-e2e.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::moon-api did not become healthy on port 8080"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
          MOON_API_HEALTH_URL: http://127.0.0.1:8080/api/health

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  playwright-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker compose build moon-tracker

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
        working-directory: src/frontend

      - run: npx playwright install chromium --with-deps
        working-directory: src/frontend

      - name: Playwright smoke via Docker Compose (E2E-04)
        run: bash scripts/ci/docker-e2e.sh
