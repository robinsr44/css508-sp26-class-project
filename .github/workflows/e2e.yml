name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (moon-api binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git

      - name: Build moon-api (E2E harness only; unit/integration tests run in CI backend job)
        run: |
          cmake -S src/backend -B build
          cmake --build build -j"$(nproc)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
        working-directory: src/frontend

      - name: Install Playwright Chromium (system deps)
        working-directory: src/frontend
        run: npx playwright install chromium --with-deps

      - name: Start moon-api on 8080
        run: |
          ./build/moon-api 8080 &
          echo $! > /tmp/moon-api-e2e.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::moon-api did not become healthy on port 8080"
          exit 1

      - name: Run Playwright E2E
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Stop moon-api
        if: always()
        run: kill "$(cat /tmp/moon-api-e2e.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 7
