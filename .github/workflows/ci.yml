name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=verbose
      # Browser E2E runs in .github/workflows/e2e.yml (Playwright + live moon-api).

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git
      - name: Configure, build, and test
        run: |
          cmake -S src/backend -B build
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure -V
      # Integration: real moon-api process + TCP. Runs scripts/ci/moon-api-smoke.sh
      # (health, version, moon 200 shape, moon 400) — see script header for mapping.
      - name: Smoke test moon-api binary (black-box + live fixture)
        run: |
          ./build/moon-api 19090 &
          echo $! > /tmp/moon-api.pid
          trap 'kill "$(cat /tmp/moon-api.pid)" 2>/dev/null || true; wait "$(cat /tmp/moon-api.pid)" 2>/dev/null || true' EXIT
          bash scripts/ci/moon-api-smoke.sh http://127.0.0.1:19090
          bash scripts/ci/live-moon-fixture.sh http://127.0.0.1:19090

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker compose build moon-tracker
      # Integration: compose up + nginx/UI + API; TestPlan DO-01 / DO-02.
      - name: Docker integration smoke (DO-01, DO-02)
        run: bash scripts/ci/docker-smoke.sh
