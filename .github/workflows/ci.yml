name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Vitest (*.test.tsx / *.test.ts per vite.config) + ESLint + Playwright E2E (real moon-api on 8080).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci

      # Playwright flows hit /api → Vite proxies to moon-api; global-setup probes /api/health on 8080.
      - name: Install toolchain for moon-api (Playwright prerequisite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake git
      - name: Build moon-api
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S src/backend -B build-fe-ci
          cmake --build build-fe-ci -j "$(nproc)" --target moon-api
      - name: Start moon-api on port 8080
        working-directory: ${{ github.workspace }}
        run: |
          ./build-fe-ci/moon-api 8080 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then
              echo "moon-api ready"
              exit 0
            fi
            sleep 0.25
          done
          echo "::error::moon-api failed to respond on /api/health"
          exit 1

      - run: npm run lint
      - run: npm test -- --reporter=verbose
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Playwright E2E
        env:
          CI: true
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git
      - name: Configure, build, and test
        run: |
          cmake -S src/backend -B build
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure -V
      # Integration: real moon-api process + TCP. Runs scripts/ci/moon-api-smoke.sh
      # (health, version, moon 200 shape, moon 400) — see script header for mapping.
      - name: Smoke test moon-api binary (black-box)
        run: |
          ./build/moon-api 19090 &
          echo $! > /tmp/moon-api.pid
          trap 'kill "$(cat /tmp/moon-api.pid)" 2>/dev/null || true; wait "$(cat /tmp/moon-api.pid)" 2>/dev/null || true' EXIT
          bash scripts/ci/moon-api-smoke.sh http://127.0.0.1:19090

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker compose build moon-tracker
      # Integration: compose up + nginx/UI + API; TestPlan DO-01 / DO-02.
      - name: Docker integration smoke (DO-01, DO-02)
        run: bash scripts/ci/docker-smoke.sh
