name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=verbose

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git
      - name: Configure, build, and test
        run: |
          cmake -S src/backend -B build
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure -V
      # Integration: real moon-api process + TCP. Runs scripts/ci/moon-api-smoke.sh
      # (health, version, moon 200 shape, moon 400) — see script header for mapping.
      - name: Smoke test moon-api binary (black-box)
        run: |
          ./build/moon-api 19090 &
          echo $! > /tmp/moon-api.pid
          trap 'kill "$(cat /tmp/moon-api.pid)" 2>/dev/null || true; wait "$(cat /tmp/moon-api.pid)" 2>/dev/null || true' EXIT
          bash scripts/ci/moon-api-smoke.sh http://127.0.0.1:19090

      - name: Upload moon-api binary for Playwright E2E
        uses: actions/upload-artifact@v4
        with:
          name: moon-api-linux
          path: build/moon-api
          retention-days: 2

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: moon-api-linux
          path: moon-api-bin

      - run: chmod +x moon-api-bin/moon-api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
        working-directory: src/frontend

      - name: Install Playwright Chromium (system deps)
        working-directory: src/frontend
        run: npx playwright install chromium --with-deps

      - name: Start moon-api on 8080
        run: |
          ./moon-api-bin/moon-api 8080 &
          echo $! > /tmp/moon-api-e2e.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::moon-api did not become healthy on port 8080"
          exit 1

      - name: Run Playwright E2E
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Stop moon-api
        if: always()
        run: kill "$(cat /tmp/moon-api-e2e.pid)" 2>/dev/null || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker compose build moon-tracker
      # Integration: compose up + nginx/UI + API; TestPlan DO-01 / DO-02.
      - name: Docker integration smoke (DO-01, DO-02)
        run: bash scripts/ci/docker-smoke.sh
